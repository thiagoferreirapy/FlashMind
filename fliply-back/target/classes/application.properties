spring.application.name=fliply-back
server.port=8080

# SQLite
spring.datasource.url=jdbc:sqlite:./fliply.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:fliply-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://192.168.15.7:5173,capacitor://localhost,ionic://localhost}

# Mail (configure para producao)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI
gemini.api.key=${AI_API_KEY:}

# Uazap (WhatsApp)
uazap.url=${UAZAP_URL:https://api.uazapi.com/send-message}
uazap.token=${UAZAP_TOKEN:}

# Password Reset
password-reset.token.secret=${PASSWORD_RESET_SECRET:fliply-password-reset-secret-key-change-in-production}
password-reset.token.expiration=${PASSWORD_RESET_EXPIRATION:3600000}
password-reset.frontend-url=${PASSWORD_RESET_URL:http://localhost:5173/#/reset-password}

# App Config
app.url=${APP_URL:http://localhost:5173}
app.name=${APP_NAME:Fliply}

# Firebase (Push Notifications)
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}

# Logging
logging.level.com.fliply=INFO
logging.level.org.springframework.security=WARN

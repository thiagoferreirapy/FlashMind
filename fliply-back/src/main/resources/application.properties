spring.application.name=fliply-back
server.port=8080

# SQLite
spring.datasource.url=jdbc:sqlite:./fliply.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:fliply-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://192.168.15.7:5173,capacitor://localhost,ionic://localhost}

# Mail (configure para producao)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.fliply=INFO
logging.level.org.springframework.security=WARN
